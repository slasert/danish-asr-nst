<script>
const CLIPS = [{"id": "dk10x377-02082000-0922_u0486186-1", "src": "../cleaned/audio/dk10x377-02082000-0922_u0486186-1.flac", "dur": 9.584, "text": "Charlotte håber til det sidste, at den rigtige person vil dukke op, købe det hele og drive det videre i hendes ånd."}, {"id": "dk11x235-14072000-1348_u0040173-1", "src": "../cleaned/audio/dk11x235-14072000-1348_u0040173-1.flac", "dur": 7.784, "text": "Ved at bore ned i en gletscher skulle man kunne danne sig et indtryk af, hvordan temperaturen har været gennem tiderne."}, {"id": "dk11x430-17072000-1147_u0047138-1", "src": "../cleaned/audio/dk11x430-17072000-1147_u0047138-1.flac", "dur": 5.584, "text": "Måske reduceres det nordiske samarbejde til venskabelige sammenkomster."}, {"id": "dk11x529-13072000-1651_u0536119-1", "src": "../cleaned/audio/dk11x529-13072000-1651_u0536119-1.flac", "dur": 4.984, "text": "Jeg har en amazonpapegøje, som jeg fik som unge for halvandet år siden."}, {"id": "dk11x529-13072000-1651_u0536196-1", "src": "../cleaned/audio/dk11x529-13072000-1651_u0536196-1.flac", "dur": 2.784, "text": "Men mange tror ikke, de kan."}, {"id": "dk12x295-09082000-1415_u0293222-1", "src": "../cleaned/audio/dk12x295-09082000-1415_u0293222-1.flac", "dur": 11.384, "text": "Den ene ekspedition talte kun en deltager, oven i købet en kvinde.På den måde blev også hun den første."}, {"id": "dk12x322-12072000-1032_u0429215-1", "src": "../cleaned/audio/dk12x322-12072000-1032_u0429215-1.flac", "dur": 5.584, "text": "Han fik et godt alibi fra både sin kone og fra sin arbejdsplads."}, {"id": "dk12x379-02082000-1248_u0488037-1", "src": "../cleaned/audio/dk12x379-02082000-1248_u0488037-1.flac", "dur": 8.784, "text": "Når man i krigstiden drejede på radioens skalaknap, kunne man sjældent undgå de tyske meldinger vedrørende fjendtlige overflyvninger."}, {"id": "dk12x379-02082000-1248_u0488116-1", "src": "../cleaned/audio/dk12x379-02082000-1248_u0488116-1.flac", "dur": 5.184, "text": "Kommissionens forslag skal behandles i en komite i næste måned."}, {"id": "dk12x379-02082000-1248_u0488119-1", "src": "../cleaned/audio/dk12x379-02082000-1248_u0488119-1.flac", "dur": 7.184, "text": "Skolen ville blive bedre, hvis der var lige mange mandlige og kvindelige lærere, siger eleverne."}, {"id": "dk12x379-02082000-1248_u0488216-1", "src": "../cleaned/audio/dk12x379-02082000-1248_u0488216-1.flac", "dur": 5.784, "text": "Byen er mest kendt for sin romproduktion og for sine fine cigarer."}, {"id": "dk12x427-14072000-1150_u0044184-1", "src": "../cleaned/audio/dk12x427-14072000-1150_u0044184-1.flac", "dur": 9.584, "text": "Det kan skabe tvivl om dommerens habilitet, uafhængighed, at han dermed har nær forbindelse til advokaten for den ene part i en sag."}, {"id": "dk12xx16-06072000-1650_u0020114-1", "src": "../cleaned/audio/dk12xx16-06072000-1650_u0020114-1.flac", "dur": 8.384, "text": "En dansk arbejder eller funktionær fremstiller flere varer per time end arbejdere og funktionærer i mange andre lande."}, {"id": "dk12xx81-02082000-1644_u0096034-1", "src": "../cleaned/audio/dk12xx81-02082000-1644_u0096034-1.flac", "dur": 6.384, "text": "Hvis du ikke retter dig efter mine forslag om at få skabt et overblik, vil jeg fratræde, og du kan ikke få en ny revisor."}, {"id": "dk12xx81-02082000-1644_u0096160-1", "src": "../cleaned/audio/dk12xx81-02082000-1644_u0096160-1.flac", "dur": 3.584, "text": "Der går stadig megen tid ved knapperne."}, {"id": "dk12xx83-03082000-1347_u0098163-1", "src": "../cleaned/audio/dk12xx83-03082000-1347_u0098163-1.flac", "dur": 6.384, "text": "Måske var jeg teknisk god nok til at nå højere, men min fysik var ikke tilstrækkelig."}, {"id": "dk13x195-08082000-1050_u0205113-1", "src": "../cleaned/audio/dk13x195-08082000-1050_u0205113-1.flac", "dur": 9.584, "text": "Omvendt savner jeg en god sparringspartner, men så må jeg i mine natlige mareridt diskutere med mig selv, om jeg valgte rigtigt."}, {"id": "dk13x232-11082000-1504_u0221069-1", "src": "../cleaned/audio/dk13x232-11082000-1504_u0221069-1.flac", "dur": 4.384, "text": "Der var serpentiner, konfetti og balloner."}, {"id": "dk13x258-31072000-1648_u0265158-1", "src": "../cleaned/audio/dk13x258-31072000-1648_u0265158-1.flac", "dur": 6.784, "text": "Jeg stiller ikke op, det er medierne, der siger sådan noget, ikke mig, påstod han."}, {"id": "dk13x258-31072000-1648_u0265167-1", "src": "../cleaned/audio/dk13x258-31072000-1648_u0265167-1.flac", "dur": 4.784, "text": "Hidtil har tilbagebetalingen gjaldt hele beløbet."}, {"id": "dk13x290-09082000-1807_u0214178-1", "src": "../cleaned/audio/dk13x290-09082000-1807_u0214178-1.flac", "dur": 5.984, "text": "Jeg er imidlertid blevet stadig mere sikker på, at det er journalist, jeg gerne vil være."}, {"id": "dk13x447-24072000-1144_u0065008-1", "src": "../cleaned/audio/dk13x447-24072000-1144_u0065008-1.flac", "dur": 6.584, "text": "Hvad synes du om den nye bank, der åbnede i går dernede på hjørnet over for kirken?"}, {"id": "dk13x447-24072000-1144_u0065046-1", "src": "../cleaned/audio/dk13x447-24072000-1144_u0065046-1.flac", "dur": 9.584, "text": "Pudsigt nok var det en afslutning, jeg skulle blive kendt for, selv om det er det, jeg i øjeblikket føler som min største svaghed."}, {"id": "dk13x447-24072000-1144_u0065120-1", "src": "../cleaned/audio/dk13x447-24072000-1144_u0065120-1.flac", "dur": 5.384, "text": "Mange af mine kolleger tør ikke stå frem, men jeg vover pelsen, siger hun."}, {"id": "dk13x592-11082000-1516_u0579091-1", "src": "../cleaned/audio/dk13x592-11082000-1516_u0579091-1.flac", "dur": 3.984, "text": "Den fidus forstod kunder fra hele landet."}, {"id": "dk13x592-11082000-1516_u0579139-1", "src": "../cleaned/audio/dk13x592-11082000-1516_u0579139-1.flac", "dur": 5.984, "text": "Op til sæsonstarten har jeg arbejdet meget med det psykologiske og det mentale i situationen."}, {"id": "dk14x234-14072000-1143_u0039053-1", "src": "../cleaned/audio/dk14x234-14072000-1143_u0039053-1.flac", "dur": 2.784, "text": "Det var da nogle underlige småting."}, {"id": "dk14x234-14072000-1143_u0039066-1", "src": "../cleaned/audio/dk14x234-14072000-1143_u0039066-1.flac", "dur": 4.584, "text": "De alternative værelser var langt fra den ønskede kvalitet."}, {"id": "dk14x234-14072000-1143_u0039134-1", "src": "../cleaned/audio/dk14x234-14072000-1143_u0039134-1.flac", "dur": 5.584, "text": "Grænserne er åbne og ytringsfrihed og pressefrihed eksisterer."}, {"id": "dk14x234-14072000-1143_u0039167-1", "src": "../cleaned/audio/dk14x234-14072000-1143_u0039167-1.flac", "dur": 3.984, "text": "Hattedamer gør sig umage, i alle relationer."}, {"id": "dk14x234-14072000-1143_u0039194-1", "src": "../cleaned/audio/dk14x234-14072000-1143_u0039194-1.flac", "dur": 3.584, "text": "Partiet stormer frem i meningsmålingerne."}, {"id": "dk14x255-24072000-1046_u0255021-1", "src": "../cleaned/audio/dk14x255-24072000-1046_u0255021-1.flac", "dur": 8.584, "text": "Den eneste musik er ikke den store romankunst, men triviallitteratur på højt plan, konstant underholdende og ganske rørende."}, {"id": "dk14x360-25072000-1340_u0469091-1", "src": "../cleaned/audio/dk14x360-25072000-1340_u0469091-1.flac", "dur": 4.584, "text": "Men den skæbne deler han med næsten alle andre deltagere."}, {"id": "dk14x464-31072000-1415_u0083084-1", "src": "../cleaned/audio/dk14x464-31072000-1415_u0083084-1.flac", "dur": 7.984, "text": "Italienerne har æren for at opfinde den tørre pasta, der kan holde sig i måneder, ja i årevis."}, {"id": "dk14x464-31072000-1415_u0083092-1", "src": "../cleaned/audio/dk14x464-31072000-1415_u0083092-1.flac", "dur": 4.784, "text": "Det markante ambitionsniveauet står tilbage."}, {"id": "dk14x464-31072000-1415_u0083101-1", "src": "../cleaned/audio/dk14x464-31072000-1415_u0083101-1.flac", "dur": 4.984, "text": "I årenes løb har han deltaget i talrige kongresser i udlandet."}, {"id": "dk14x591-11082000-1248_u0578088-1", "src": "../cleaned/audio/dk14x591-11082000-1248_u0578088-1.flac", "dur": 4.584, "text": "Politikerne kan ikke blive enige om liberalisering."}, {"id": "dk14x591-11082000-1248_u0578134-1", "src": "../cleaned/audio/dk14x591-11082000-1248_u0578134-1.flac", "dur": 9.184, "text": "Hun skulle have en kjole til festen dagen før brylluppet, én hvid kjole til selve brylluppet, og én til festen dagen derpå."}, {"id": "dk15x104-04072000-1034_u0007011-1", "src": "../cleaned/audio/dk15x104-04072000-1034_u0007011-1.flac", "dur": 7.584, "text": "Jeg er ikke særlig interesseret i at stå og fryse her, mens de andre sidder og hygger sig derhjemme foran pejsen."}, {"id": "dk15x176-31072000-1531_u0183136-1", "src": "../cleaned/audio/dk15x176-31072000-1531_u0183136-1.flac", "dur": 5.784, "text": "Det er en opbyggelig flugt fra de daglige rutiner og de periodiske nedture."}, {"id": "dk15x372-31072000-1350_u0481222-1", "src": "../cleaned/audio/dk15x372-31072000-1350_u0481222-1.flac", "dur": 6.384, "text": "Baggrunden er ikke alene, at arkitekturkendere vurderer de fire bygninger meget højt."}, {"id": "dk15x476-03082000-1627_u0095129-1", "src": "../cleaned/audio/dk15x476-03082000-1627_u0095129-1.flac", "dur": 4.384, "text": "Han glæder sig allerede til selv at sejle rundt i båden hele sommeren."}, {"id": "dk15x521-11072000-2129_u0527141-1", "src": "../cleaned/audio/dk15x521-11072000-2129_u0527141-1.flac", "dur": 5.184, "text": "Indtil videre er de store multinationale selskaber sluppet med skrækken."}, {"id": "dk15x521-11072000-2129_u0527158-1", "src": "../cleaned/audio/dk15x521-11072000-2129_u0527158-1.flac", "dur": 4.584, "text": "Hun træder ind i den og udfylder den med sin egen personlighed."}, {"id": "dk15x526-12072000-1643_u0533120-1", "src": "../cleaned/audio/dk15x526-12072000-1643_u0533120-1.flac", "dur": 3.384, "text": "Vi har ventet på en chance for at stikke af i mange år."}, {"id": "dk15x526-12072000-1643_u0533140-1", "src": "../cleaned/audio/dk15x526-12072000-1643_u0533140-1.flac", "dur": 4.584, "text": "Som ballast har hun blandt andet en uddannelse som farmaceut."}, {"id": "dk15x528-13072000-1132_u0535083-1", "src": "../cleaned/audio/dk15x528-13072000-1132_u0535083-1.flac", "dur": 5.784, "text": "Det er også blevet tilladt at friholde en enkelt lejlighed til fællesrum og opholdssted for personale."}, {"id": "dk15x547-21072000-1006_u0507032-1", "src": "../cleaned/audio/dk15x547-21072000-1006_u0507032-1.flac", "dur": 5.984, "text": "Omsider er det gået op for politikere og visse fagfolk, at danske børn læser, skriver og regner dårligere end børn i andre lande."}, {"id": "dk15xx13-06072000-1912_u0017120-1", "src": "../cleaned/audio/dk15xx13-06072000-1912_u0017120-1.flac", "dur": 3.584, "text": "Det blev der talt meget om det forår."}, {"id": "dk15xx13-06072000-1912_u0017141-1", "src": "../cleaned/audio/dk15xx13-06072000-1912_u0017141-1.flac", "dur": 3.184, "text": "Kan du finde ud af din egen personlige skat?"}, {"id": "dk15xx66-28072000-1645_u0085073-1", "src": "../cleaned/audio/dk15xx66-28072000-1645_u0085073-1.flac", "dur": 3.984, "text": "De vil have det, de vil prøve det, og de vil bruge det."}, {"id": "dk15xx76-31072000-1643_u0089214-1", "src": "../cleaned/audio/dk15xx76-31072000-1643_u0089214-1.flac", "dur": 3.784, "text": "Hun kan få mig til at grine, når jeg er ked af det."}, {"id": "dk16x185-03082000-1434_u0192010-1", "src": "../cleaned/audio/dk16x185-03082000-1434_u0192010-1.flac", "dur": 8.384, "text": "Dan havde lavet en flot tegning af en sol og en måne med hat og tre øjne, som blev hængt op i skolen, så alle kunne se den."}, {"id": "dk16x185-03082000-1434_u0192091-1", "src": "../cleaned/audio/dk16x185-03082000-1434_u0192091-1.flac", "dur": 6.184, "text": "Salget af det raffinerede lingeri går strygende, men indtjeningen er ikke fulgt med."}, {"id": "dk16x185-03082000-1434_u0192113-1", "src": "../cleaned/audio/dk16x185-03082000-1434_u0192113-1.flac", "dur": 3.584, "text": "Den unge familie slipper for at flytte tilbage."}, {"id": "dk16x375-01082000-1302_u0484178-1", "src": "../cleaned/audio/dk16x375-01082000-1302_u0484178-1.flac", "dur": 4.384, "text": "Resultatet er, at otte stiller op i første runde."}, {"id": "dk16x417-12072000-1347_u0030036-1", "src": "../cleaned/audio/dk16x417-12072000-1347_u0030036-1.flac", "dur": 11.384, "text": "Italienerne elsker den trådløse telefon, og den er med overalt og ringer konstant i busser, toge, på bar, stranden, diskoteker og restauranter."}, {"id": "dk16x417-12072000-1347_u0030094-1", "src": "../cleaned/audio/dk16x417-12072000-1347_u0030094-1.flac", "dur": 6.584, "text": "Jeg begyndte alene, men får nu støtte fra hundredevis af unge fra alle fire verdenshjørner."}, {"id": "dk16x417-12072000-1347_u0030101-1", "src": "../cleaned/audio/dk16x417-12072000-1347_u0030101-1.flac", "dur": 4.584, "text": "De samarbejder med den siddende regering."}, {"id": "dk16x417-12072000-1347_u0030139-1", "src": "../cleaned/audio/dk16x417-12072000-1347_u0030139-1.flac", "dur": 10.184, "text": "Dem, der ikke har mod på at få ski på, kan til gengæld få deres livs længste kælketur, og tilmed på en olympisk kælkebakke."}, {"id": "dk16x417-12072000-1347_u0030217-1", "src": "../cleaned/audio/dk16x417-12072000-1347_u0030217-1.flac", "dur": 5.984, "text": "De mødes i dag for at drøfte de nye tekniske muligheder."}, {"id": "dk16x557-24072000-1535_u0518054-1", "src": "../cleaned/audio/dk16x557-24072000-1535_u0518054-1.flac", "dur": 3.784, "text": "Men de skal også kunne tage imod en god forklaring."}, {"id": "dk16x557-24072000-1535_u0518183-1", "src": "../cleaned/audio/dk16x557-24072000-1535_u0518183-1.flac", "dur": 6.984, "text": "Importøren vil sikkert have svært ved at se noget trist i dette, særlig eftersom disse biler tilmed er solgt."}, {"id": "dk17x202-03072000-1548_u0006036-1", "src": "../cleaned/audio/dk17x202-03072000-1548_u0006036-1.flac", "dur": 7.784, "text": "Dette har givetvis været en lettere arbejdsgang for lægerne, men det er ikke i overensstemmelse med patienternes krav om fuld information."}, {"id": "dk17x202-03072000-1548_u0006093-1", "src": "../cleaned/audio/dk17x202-03072000-1548_u0006093-1.flac", "dur": 4.584, "text": "Derefter vil arbejdet med at tilrettelægge undersøgelsen gå i gang."}, {"id": "dk17x202-03072000-1548_u0006133-1", "src": "../cleaned/audio/dk17x202-03072000-1548_u0006133-1.flac", "dur": 3.584, "text": "Ejendommene er heller ikke blevet tilstrækkeligt moderniserede."}, {"id": "dk17x216-11072000-1157_u0022098-1", "src": "../cleaned/audio/dk17x216-11072000-1157_u0022098-1.flac", "dur": 6.384, "text": "Og i dag bruges filibuster i en lang række sprog om en talersabotør."}, {"id": "dk17x276-20092000-1753_u0588133-1", "src": "../cleaned/audio/dk17x276-20092000-1753_u0588133-1.flac", "dur": 7.184, "text": "Shopping i små butikker er dejligst, meditation og religion et hit, glimmer og prangende mærkevarer yt."}, {"id": "dk17x283-10082000-1204_u0122119-1", "src": "../cleaned/audio/dk17x283-10082000-1204_u0122119-1.flac", "dur": 3.784, "text": "Enkelte gange gik det stærkt for arrangørerne."}, {"id": "dk17x283-10082000-1204_u0122194-1", "src": "../cleaned/audio/dk17x283-10082000-1204_u0122194-1.flac", "dur": 3.384, "text": "Der er jo uro alle mulige andre steder."}, {"id": "dk17x319-04102000-2048_u0546023-1", "src": "../cleaned/audio/dk17x319-04102000-2048_u0546023-1.flac", "dur": 8.584, "text": "Den stigende handel med de nye demokratier har samlet ikke ført til tab af danske arbejdspladser, sådan som det ofte påstås."}, {"id": "dk17x319-04102000-2048_u0546066-1", "src": "../cleaned/audio/dk17x319-04102000-2048_u0546066-1.flac", "dur": 6.384, "text": "Jeg kender ikke manden personligt, men det virker, som om han ikke engang kender sig selv."}, {"id": "dk18x166-20072000-1642_u0166159-1", "src": "../cleaned/audio/dk18x166-20072000-1642_u0166159-1.flac", "dur": 5.784, "text": "Det viser, at de tager sagen alvorligt og spiller et åbent spil i forhold til den danske regering."}, {"id": "dk18x219-11072000-1507_u0024089-1", "src": "../cleaned/audio/dk18x219-11072000-1507_u0024089-1.flac", "dur": 2.584, "text": "Vi skal selvfølgelig sige fra over for volden."}, {"id": "dk18x219-11072000-1507_u0024166-1", "src": "../cleaned/audio/dk18x219-11072000-1507_u0024166-1.flac", "dur": 3.584, "text": "Hver af stenene gøres nu klar til at bære hver deres farve."}, {"id": "dk18x219-11072000-1507_u0024176-1", "src": "../cleaned/audio/dk18x219-11072000-1507_u0024176-1.flac", "dur": 2.384, "text": "Jeg har al mulig tiltro til de her unge."}, {"id": "dk18x445-28092000-1836_u0543101-1", "src": "../cleaned/audio/dk18x445-28092000-1836_u0543101-1.flac", "dur": 3.984, "text": "Der er mange, man har tæt tilknytning til."}, {"id": "dk19x493-15082000-1509_u0114152-1", "src": "../cleaned/audio/dk19x493-15082000-1509_u0114152-1.flac", "dur": 5.784, "text": "Når man bevilges hjemmehjælp afgør hjemmehjælpslederen, hvilke hjælpemidler, der skal anvendes i hjemmet."}, {"id": "dk19x499-05102000-2045_u0547077-1", "src": "../cleaned/audio/dk19x499-05102000-2045_u0547077-1.flac", "dur": 7.784, "text": "Programmet skal gøre en i stand til at løse alt, lige fra planlægning af en hovedstad i et uland til et særlig ergonomisk dørhåndtag."}, {"id": "dk19x499-05102000-2045_u0547161-1", "src": "../cleaned/audio/dk19x499-05102000-2045_u0547161-1.flac", "dur": 4.184, "text": "Vandrersæsonen i de svenske fjelde er netop nu på sit højeste."}, {"id": "dk21x513-07072000-1202_u0516008-1", "src": "../cleaned/audio/dk21x513-07072000-1202_u0516008-1.flac", "dur": 5.984, "text": "Hvad synes du om den nye bank, der åbnede i går dernede på hjørnet over for kirken?"}, {"id": "dk21x513-07072000-1202_u0516129-1", "src": "../cleaned/audio/dk21x513-07072000-1202_u0516129-1.flac", "dur": 11.584, "text": "Således opstår en kontinuitet gennem hele kunstværket, hvis fortsættelse, ud over dets fysiske grænse, det er logisk at forestille sig."}, {"id": "dk21x513-07072000-1202_u0516153-1", "src": "../cleaned/audio/dk21x513-07072000-1202_u0516153-1.flac", "dur": 6.584, "text": "Spekulanter kunne på få minutter ødelægge frugten af millioner af menneskers arbejde."}, {"id": "dk21x513-07072000-1202_u0516177-1", "src": "../cleaned/audio/dk21x513-07072000-1202_u0516177-1.flac", "dur": 9.184, "text": "I hvert fald hvis man kan nyde dem i lænestolens sikre havn uden fare for kølhaling, skørbug og seje beskøjter med mere."}, {"id": "dk21x573-01082000-1227_u0559012-1", "src": "../cleaned/audio/dk21x573-01082000-1227_u0559012-1.flac", "dur": 7.584, "text": "Gaden er lukket for gennemgående færdsel ti måneder om året, men man kan køre udenom, hvis man drejer til højre i krydset."}, {"id": "dk21x573-01082000-1227_u0559217-1", "src": "../cleaned/audio/dk21x573-01082000-1227_u0559217-1.flac", "dur": 4.384, "text": "Vi er ikke i tvivl om, at der er kvalitetsforskel mellem rækkerne."}, {"id": "dk22x415-12072000-1030_u0026177-1", "src": "../cleaned/audio/dk22x415-12072000-1030_u0026177-1.flac", "dur": 8.784, "text": "Den vordende brudgom, er inde i alle detaljer omkring tilblivelsen af brudebuketten til på lørdag."}, {"id": "dk23x440-20072000-1711_u0057178-1", "src": "../cleaned/audio/dk23x440-20072000-1711_u0057178-1.flac", "dur": 1.984, "text": "Det går jo meget godt."}, {"id": "dk23xx32-11072000-1813_u0036009-1", "src": "../cleaned/audio/dk23xx32-11072000-1813_u0036009-1.flac", "dur": 7.184, "text": "Han løb ud i det lille køkken for at sige tak for kaffe til Pers kone, men hun var ikke til at se."}, {"id": "dk23xx32-11072000-1813_u0036021-1", "src": "../cleaned/audio/dk23xx32-11072000-1813_u0036021-1.flac", "dur": 8.784, "text": "Man ligger uroligt og får en masse motion, som man måske ikke har skade af, men alligevel sagtens kunne have undværet."}, {"id": "dk23xx32-11072000-1813_u0036154-1", "src": "../cleaned/audio/dk23xx32-11072000-1813_u0036154-1.flac", "dur": 4.784, "text": "Hans muligheder er fantastiske, og jeg har den største respekt for hans talent."}, {"id": "dk23xx32-11072000-1813_u0036220-1", "src": "../cleaned/audio/dk23xx32-11072000-1813_u0036220-1.flac", "dur": 7.384, "text": "Det hører til enhver sportsredaktions hverdag at besvare spørgsmål og afgøre væddemål fra sportsinteresserede læsere."}, {"id": "dk24x244-28072000-1353_u0261083-1", "src": "../cleaned/audio/dk24x244-28072000-1353_u0261083-1.flac", "dur": 4.984, "text": "I november i fjor indledtes så retsmøderne i den sag, der blev afgjort i går."}, {"id": "dk24x244-28072000-1353_u0261134-1", "src": "../cleaned/audio/dk24x244-28072000-1353_u0261134-1.flac", "dur": 6.384, "text": "Sammen med instruktøren leverer skuespillerne en flot og mærkeligt bevægende præstation."}, {"id": "dk25x189-04082000-1136_u0196032-1", "src": "../cleaned/audio/dk25x189-04082000-1136_u0196032-1.flac", "dur": 9.184, "text": "Der kan i de største turneringer for de største stjerners vedkommende være tale om både fire og fem gange så stort et beløb."}, {"id": "dk30x225-11082000-0944_u0219219-1", "src": "../cleaned/audio/dk30x225-11082000-0944_u0219219-1.flac", "dur": 5.984, "text": "Venner og familie hepper på ved at give lydløse heppesignaler."}, {"id": "dk99x247-19072000-1818_u0053029-1", "src": "../cleaned/audio/dk99x247-19072000-1818_u0053029-1.flac", "dur": 6.984, "text": "Men jeg har indrettet mig med mine regnskaber herinde i huset, så jeg ikke behøver at køre hjem, når løbet skydes af."}, {"id": "dk99x247-19072000-1818_u0053120-1", "src": "../cleaned/audio/dk99x247-19072000-1818_u0053120-1.flac", "dur": 2.384, "text": "De gik i den forkerte retning."}, {"id": "dk99x247-19072000-1818_u0053132-1", "src": "../cleaned/audio/dk99x247-19072000-1818_u0053132-1.flac", "dur": 2.384, "text": "Men det var for sent."}, {"id": "dk99x247-19072000-1818_u0053194-1", "src": "../cleaned/audio/dk99x247-19072000-1818_u0053194-1.flac", "dur": 4.584, "text": "En dansker har oplevet succesen og trænerfyringen på nærmeste hold."}], VERDICTS = {"ok": "transcript matches the audio", "wrong_word": "wrong word(s)", "missing_word": "spoken word(s) missing from the transcript", "extra_word": "transcript has word(s) that are not spoken", "mismatch": "transcript belongs to other audio / mostly wrong", "unclear": "audio too unclear to judge"}, KEY = "aek-audit-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const list = document.getElementById("list");
document.getElementById("total").textContent = CLIPS.length;
const auditor = document.getElementById("auditor");
auditor.value = state._auditor || "";
auditor.oninput = () => { state._auditor = auditor.value; save(); };
function refresh() {
  let n = 0;
  CLIPS.forEach((c, i) => {
    const s = state[c.id] || {}, el = document.getElementById("c" + i);
    el.className = "clip" + (s.v ? (s.v === "ok" ? " done" : " err") : "");
    if (s.v) n++;
  });
  document.getElementById("count").textContent = n;
}
CLIPS.forEach((c, i) => {
  const d = document.createElement("div");
  d.id = "c" + i;
  const opts = ['<option value="">-- verdict --</option>'].concat(
    Object.entries(VERDICTS).map(([k, v]) => `<option value="${k}">${v}</option>`)).join("");
  d.innerHTML = `<div class="meta">${i + 1}. ${c.id} (${c.dur} s)</div>
    <audio controls preload="none" src="${c.src}"></audio>
    <div class="text"></div>
    <select>${opts}</select><input type="text" placeholder="note: what is wrong (optional)">`;
  d.querySelector(".text").textContent = c.text;
  const sel = d.querySelector("select"), note = d.querySelector("input");
  const s = state[c.id] || {};
  sel.value = s.v || ""; note.value = s.n || "";
  sel.onchange = () => { state[c.id] = {...(state[c.id] || {}), v: sel.value}; save(); refresh(); };
  note.oninput = () => { state[c.id] = {...(state[c.id] || {}), n: note.value}; save(); };
  list.appendChild(d);
});
refresh();
document.getElementById("dl").onclick = () => {
  const missing = CLIPS.filter(c => !(state[c.id] || {}).v).length;
  if (missing && !confirm(missing + " clips have no verdict yet. Download anyway?")) return;
  if (!auditor.value.trim()) { alert("Please enter your name first."); return; }
  const q = x => '"' + String(x || "").replace(/"/g, '""') + '"';
  const rows = ["utt_id,verdict,note,auditor"].concat(CLIPS.map(c => {
    const s = state[c.id] || {};
    return [c.id, s.v, s.n, auditor.value.trim()].map(q).join(",");
  }));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([rows.join("\n") + "\n"], {type: "text/csv"}));
  a.download = "audit_results.csv";
  a.click();
};
</script></body></html>
